name: Compile C++ into executables for Windows, Linux, and Mac

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: g++ -std=c++17 -O2 minesweeper.cpp -o minesweeper-linux

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: g++ -std=c++17 -O2 minesweeper.cpp -o minesweeper-mac

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: g++ -std=c++17 -O2 minesweeper.cpp -o minesweeper-windows.exe

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ runner.os }}
          path: minesweeper-*
